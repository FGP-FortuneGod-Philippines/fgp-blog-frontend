name: CI/CD Pipeline

on:
  push:
    branches:
    - main
    - development
  pull_request:
    branches:
    - main
    - development
jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint || true

    - name: Run Tests
      run: npm test
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' # Only deploy from main branch

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t moriiarty/fgp-blog-frontend-web:latest .
        docker tag moriiarty/fgp-blog-frontend-web:latest moriiarty/fgp-blog-frontend-web:${{ github.sha }}

    - name: Push Docker image
      run: |
        docker push moriiarty/fgp-blog-frontend-web:latest
        docker push moriiarty/fgp-blog-frontend-web:${{ github.sha }}
